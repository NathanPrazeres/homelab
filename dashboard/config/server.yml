- name: Server
  columns:
    - size: small
      widgets:
        - type: server-stats
          servers:
            - type: local
              name: Services
              hide-mountpoints-by-default: true
              mountpoints:
                "/":
                  name: Root
                  hide: false
                "/data":
                  name: Data
                  hide: false
        - type: dns-stats
          service: pihole-v6
          url: http://pihole.${DOMAIN}/
          password: ${PIHOLE_PASSWORD}
          hour-format: 24h
        - type: monitor
          cache: 1m
          title: ""
          sites:
            - title: Pi-Hole
              url: http://pihole.${DOMAIN}/
              icon: di:pi-hole
              allow-insecure: true

    - size: full
      widgets:
        - type: group
          widgets:
            - type: docker-containers
              title: "Docker Containers"
              cache: 1m       # optional, how often to cache data
              all: true       # whether to show stopped containers, etc
              hide: false     # hide disabled
              # optionally order, filters, etc

            # NOTE: Only available on Dynacat, NOT Glance
            - type: playing
              episode-title-format: series
              frameless: true
              hide-username: true
              hosts:
                - url: jellyfin:https://media.${DOMAIN}
                  token: ${JELLYFIN_KEY}
                  username: ${JELLYFIN_USER}
              play-state: text
              show-paused: true
              show-progress-bar: true
              show-progress-info: true
              show-thumbnail: true

            - type: latest-media
              columns: 3
              frameless: true
              hosts:
                - url: jellyfin:https://media.${DOMAIN}
                  libraries:
                    - Shows
                    - Movies
                  token: ${JELLYFIN_KEY}
              item-count: 12

            # - $include: widgets/jellyfin.yml
            # - $include: widgets/media.yml
            - $include: widgets/qbit.yml
            - $include: widgets/immich.yml
            - $include: widgets/nextcloud-deck.yml

    - size: small
      widgets:
        - $include: widgets/cup.yml

        - type: releases
          show-source-icon: true
          cache: 1h
          # Without authentication the Github API allows for up to 60 requests per hour. You can create a
          # read-only token from your Github account settings and use it here to increase the limit.
          # token: ...
          repositories:
            - docker/compose
            - pi-hole/pi-hole
            - pivpn/pivpn
            - fail2ban/fail2ban
            - dockerhub:caddy:alpine
            - dockerhub:caddy:builder-alpine
