services:
  dashboard:
    container_name: dashboard
    image: panonim/dynacat
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CONFIG_DIR}/config:/app/config
      - ${CONFIG_DIR}/assets:/app/assets
      - ${DATA_DIR}:/data:ro
    networks:
      - glance
      - rev_proxy
    env_file: ".env"
    extra_hosts:
      - "pihole.nvsp.dev:$PIHOLE_HOST"  # Fix the monitor widget for Pi-Hole
    labels:
      glance.name: Dynacat
      glance.icon: di:dynacat
      glance.url: https://dash.nvsp.dev/
      glance.description: Server's Web Dashboard
      glance.id: dashboard

  cup:
    image: ghcr.io/sergi0g/cup:latest
    container_name: cup
    command: ["serve", "-p", "9000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - glance
    labels:
      glance.name: Cup
      glance.parent: dashboard
      # glance.icon: sh:cup-updates
      # glance.url: http://cup:9000/
      # glance.description: Docker Image Update Checker
      # glance.id: cup

networks:
  rev_proxy:
    external: true
  glance:
    ipam:
      config:
        - subnet: 172.22.0.0/16
